# LuxeFinds Docker Compose Configuration
# Organized with profiles for selective service startup
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d              # Core services only
#   docker compose -f docker/docker-compose.yml --profile ai up -d # With AI services
#   docker compose -f docker/docker-compose.yml --profile '*' up -d # All services
#
# See docker/README.md for detailed documentation

version: '3.8'

services:
  # ============================================================================
  # CORE SERVICES (Always enabled - database and cache)
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: luxefinds-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luxefinds_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luxefinds_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-luxefinds}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luxefinds_admin} -d ${POSTGRES_DB:-luxefinds}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxefinds
    labels:
      - "com.luxefinds.service=database"
      - "com.luxefinds.description=PostgreSQL database"

  redis:
    image: redis:7-alpine
    container_name: luxefinds-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory ${REDIS_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxefinds
    labels:
      - "com.luxefinds.service=cache"
      - "com.luxefinds.description=Redis cache and signaling"

  # ============================================================================
  # AI SERVICES (Optional - enabled with --profile ai)
  # ============================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: luxefinds-ollama
    restart: unless-stopped
    profiles:
      - ai
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - luxefinds
    labels:
      - "com.luxefinds.service=ai"
      - "com.luxefinds.description=Ollama AI models service"

  # ============================================================================
  # MONITORING SERVICES (Optional - enabled with --profile monitoring)
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: luxefinds-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - luxefinds
    labels:
      - "com.luxefinds.service=monitoring"
      - "com.luxefinds.description=Prometheus metrics collection"

  grafana:
    image: grafana/grafana:latest
    container_name: luxefinds-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - luxefinds
    labels:
      - "com.luxefinds.service=monitoring"
      - "com.luxefinds.description=Grafana dashboards"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: luxefinds-alertmanager
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - luxefinds
    labels:
      - "com.luxefinds.service=monitoring"
      - "com.luxefinds.description=AlertManager for alerts"

  # ============================================================================
  # HIGH AVAILABILITY SERVICES (Optional - enabled with --profile ha)
  # ============================================================================

  # Redis Sentinel Setup (for HA)
  redis-master:
    image: redis:7-alpine
    container_name: luxefinds-redis-master
    restart: unless-stopped
    profiles:
      - ha
    ports:
      - "${REDIS_MASTER_PORT:-6379}:6379"
    volumes:
      - redis_master_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --replica-announce-ip redis-master
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.luxefinds.service=cache-ha"
      - "com.luxefinds.description=Redis HA master"

  redis-replica-1:
    image: redis:7-alpine
    container_name: luxefinds-redis-replica-1
    restart: unless-stopped
    profiles:
      - ha
    ports:
      - "${REDIS_REPLICA_1_PORT:-6380}:6379"
    volumes:
      - redis_replica_1_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --replicaof redis-master 6379
      --replica-announce-ip redis-replica-1
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.luxefinds.service=cache-ha"
      - "com.luxefinds.description=Redis HA replica 1"

  redis-replica-2:
    image: redis:7-alpine
    container_name: luxefinds-redis-replica-2
    restart: unless-stopped
    profiles:
      - ha
    ports:
      - "${REDIS_REPLICA_2_PORT:-6381}:6379"
    volumes:
      - redis_replica_2_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --replicaof redis-master 6379
      --replica-announce-ip redis-replica-2
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.luxefinds.service=cache-ha"
      - "com.luxefinds.description=Redis HA replica 2"

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: luxefinds-sentinel-1
    restart: unless-stopped
    profiles:
      - ha
    ports:
      - "${SENTINEL_1_PORT:-26379}:26379"
    command: >
      sh -c "sleep 3 &&
             MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
             echo 'port 26379' > /tmp/sentinel.conf &&
             echo 'dir /tmp' >> /tmp/sentinel.conf &&
             echo \"sentinel monitor mymaster $$MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.luxefinds.service=cache-ha"
      - "com.luxefinds.description=Redis Sentinel 1"

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: luxefinds-sentinel-2
    restart: unless-stopped
    profiles:
      - ha
    ports:
      - "${SENTINEL_2_PORT:-26380}:26379"
    command: >
      sh -c "sleep 3 &&
             MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
             echo 'port 26379' > /tmp/sentinel.conf &&
             echo 'dir /tmp' >> /tmp/sentinel.conf &&
             echo \"sentinel monitor mymaster $$MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.luxefinds.service=cache-ha"
      - "com.luxefinds.description=Redis Sentinel 2"

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: luxefinds-sentinel-3
    restart: unless-stopped
    profiles:
      - ha
    ports:
      - "${SENTINEL_3_PORT:-26381}:26379"
    command: >
      sh -c "sleep 3 &&
             MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
             echo 'port 26379' > /tmp/sentinel.conf &&
             echo 'dir /tmp' >> /tmp/sentinel.conf &&
             echo \"sentinel monitor mymaster $$MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.luxefinds.service=cache-ha"
      - "com.luxefinds.description=Redis Sentinel 3"

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  luxefinds:
    driver: bridge
  redis-sentinel:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  # Core volumes
  postgres_data:
    driver: local
  redis_data:
    driver: local

  # AI volumes
  ollama_data:
    driver: local

  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

  # HA volumes
  redis_master_data:
    driver: local
  redis_replica_1_data:
    driver: local
  redis_replica_2_data:
    driver: local
