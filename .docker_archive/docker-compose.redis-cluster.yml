version: '3.8'

# Redis Cluster Configuration
# Provides horizontal scaling with automatic sharding across 6 nodes (3 masters + 3 replicas)

services:
  # Redis Cluster Nodes (Masters)
  redis-cluster-1:
    image: redis:7-alpine
    container_name: redis-cluster-1
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes-7001.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis-cluster-1-data:/data
    networks:
      - redis-cluster-net
    restart: unless-stopped

  redis-cluster-2:
    image: redis:7-alpine
    container_name: redis-cluster-2
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes-7002.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis-cluster-2-data:/data
    networks:
      - redis-cluster-net
    restart: unless-stopped

  redis-cluster-3:
    image: redis:7-alpine
    container_name: redis-cluster-3
    command: >
      redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes-7003.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - redis-cluster-3-data:/data
    networks:
      - redis-cluster-net
    restart: unless-stopped

  # Redis Cluster Nodes (Replicas)
  redis-cluster-4:
    image: redis:7-alpine
    container_name: redis-cluster-4
    command: >
      redis-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes-7004.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - redis-cluster-4-data:/data
    networks:
      - redis-cluster-net
    restart: unless-stopped

  redis-cluster-5:
    image: redis:7-alpine
    container_name: redis-cluster-5
    command: >
      redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes-7005.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - redis-cluster-5-data:/data
    networks:
      - redis-cluster-net
    restart: unless-stopped

  redis-cluster-6:
    image: redis:7-alpine
    container_name: redis-cluster-6
    command: >
      redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes-7006.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "7006:7006"
      - "17006:17006"
    volumes:
      - redis-cluster-6-data:/data
    networks:
      - redis-cluster-net
    restart: unless-stopped

  # Redis Cluster Initializer
  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
      - redis-cluster-4
      - redis-cluster-5
      - redis-cluster-6
    command: >
      sh -c "
      sleep 5 &&
      redis-cli --cluster create
      redis-cluster-1:7001
      redis-cluster-2:7002
      redis-cluster-3:7003
      redis-cluster-4:7004
      redis-cluster-5:7005
      redis-cluster-6:7006
      --cluster-replicas 1
      --cluster-yes
      "
    networks:
      - redis-cluster-net

networks:
  redis-cluster-net:
    driver: bridge

volumes:
  redis-cluster-1-data:
  redis-cluster-2-data:
  redis-cluster-3-data:
  redis-cluster-4-data:
  redis-cluster-5-data:
  redis-cluster-6-data:
