# Redis Sentinel High Availability Setup
# 1 Master + 2 Replicas + 3 Sentinel nodes
# Start: docker compose -f docker-compose.redis-sentinel.yml up -d
# Stop: docker compose -f docker-compose.redis-sentinel.yml down
# Logs: docker compose -f docker-compose.redis-sentinel.yml logs -f

services:
  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: luxefinds-redis-master
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --replica-announce-ip redis-master
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Replica 1
  redis-replica-1:
    image: redis:7-alpine
    container_name: luxefinds-redis-replica-1
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_replica_1_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --replicaof redis-master 6379
      --replica-announce-ip redis-replica-1
    depends_on:
      - redis-master
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Replica 2
  redis-replica-2:
    image: redis:7-alpine
    container_name: luxefinds-redis-replica-2
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_replica_2_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --replicaof redis-master 6379
      --replica-announce-ip redis-replica-2
    depends_on:
      - redis-master
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sentinel 1
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: luxefinds-sentinel-1
    restart: unless-stopped
    ports:
      - "26379:26379"
    command: >
      sh -c "sleep 3 &&
             MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
             echo 'port 26379' > /tmp/sentinel.conf &&
             echo 'dir /tmp' >> /tmp/sentinel.conf &&
             echo \"sentinel monitor mymaster $$MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sentinel 2
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: luxefinds-sentinel-2
    restart: unless-stopped
    ports:
      - "26380:26379"
    command: >
      sh -c "sleep 3 &&
             MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
             echo 'port 26379' > /tmp/sentinel.conf &&
             echo 'dir /tmp' >> /tmp/sentinel.conf &&
             echo \"sentinel monitor mymaster $$MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sentinel 3
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: luxefinds-sentinel-3
    restart: unless-stopped
    ports:
      - "26381:26379"
    command: >
      sh -c "sleep 3 &&
             MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
             echo 'port 26379' > /tmp/sentinel.conf &&
             echo 'dir /tmp' >> /tmp/sentinel.conf &&
             echo \"sentinel monitor mymaster $$MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  redis-sentinel:
    driver: bridge

volumes:
  redis_master_data:
    driver: local
  redis_replica_1_data:
    driver: local
  redis_replica_2_data:
    driver: local
