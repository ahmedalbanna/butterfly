# Sentinel 3 Configuration
port 26379
dir /tmp

# Monitor the master named "mymaster"
sentinel monitor mymaster redis-master 6379 2

# Master is considered down after 5 seconds without response
sentinel down-after-milliseconds mymaster 5000

# Timeout for failover
sentinel failover-timeout mymaster 60000

# Only 1 replica can sync with new master at a time during failover
sentinel parallel-syncs mymaster 1

# Announce this sentinel to clients
sentinel announce-ip localhost
sentinel announce-port 26381
