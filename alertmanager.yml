# AlertManager configuration for Butterfly Store CDC alerts

global:
  resolve_timeout: 5m

# Alert routing
route:
  group_by: ['alertname', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
    
    # Warning alerts - batched notifications
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_interval: 5m
      repeat_interval: 1h

# Alert receivers
receivers:
  # Default receiver (logs to console)
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9002/api/webhooks/alerts'
        send_resolved: true

  # Critical alerts (multiple channels)
  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:9002/api/webhooks/alerts'
        send_resolved: true
    # Uncomment and configure for Slack
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts-critical'
    #     title: '🚨 Critical Alert: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    
    # Uncomment and configure for email
    # email_configs:
    #   - to: 'oncall@example.com'
    #     from: 'alerts@butterfly-store.com'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'alerts@butterfly-store.com'
    #     auth_password: 'your-password'

  # Warning alerts
  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:9002/api/webhooks/alerts'
        send_resolved: true
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts-warning'
    #     title: '⚠️ Warning: {{ .GroupLabels.alertname }}'

# Inhibition rules (suppress certain alerts)
inhibit_rules:
  # If CDC listener is down, suppress all cache-related alerts
  - source_match:
      alertname: 'CDCListenerDown'
    target_match_re:
      alertname: '.*Cache.*'
    equal: ['component']
  
  # If Redis is disconnected, suppress cache alerts
  - source_match:
      alertname: 'RedisDisconnected'
    target_match_re:
      alertname: '.*Cache.*'
    equal: ['component']
