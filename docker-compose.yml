# LuxeFinds PostgreSQL Database
# Start: docker compose up -d
# Stop: docker compose down
# Logs: docker compose logs -f postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: luxefinds-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: luxefinds_admin
      POSTGRES_PASSWORD: luxefinds_secure_pass_2026
      POSTGRES_DB: luxefinds
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxefinds_admin -d luxefinds"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
